<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSR Knowledge Base</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>MSR Knowledge Base</h1>
        <p>A reference guide for Mining Software Repositories research.</p>
    </header>

    <main class="tabs">
        <input type="radio" name="tabs" id="tab-data-sources" checked>
        <input type="radio" name="tabs" id="tab-collection-methods">
        <input type="radio" name="tabs" id="tab-analysis-methods">
        <input type="radio" name="tabs" id="tab-publication-venues">

        <nav class="tab-list" aria-label="Knowledge base categories">
            <label class="tab" for="tab-data-sources">Data Sources</label>
            <label class="tab" for="tab-collection-methods">Collection Methods</label>
            <label class="tab" for="tab-analysis-methods">Analysis Methods</label>
            <label class="tab" for="tab-publication-venues">Publication Venues</label>
        </nav>

        <section id="data-sources" class="tab-content">
            <h2>Data Sources</h2>
        </section>

        <section id="collection-methods" class="tab-content">
            <h2>Collection Methods</h2>
        </section>

        <section id="analysis-methods" class="tab-content">
            <h2>Analysis Methods</h2>
        </section>

        <section id="publication-venues" class="tab-content">
            <h2>Publication Venues</h2>
        </section>
    </main>
</body>
</html>
